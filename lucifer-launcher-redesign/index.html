<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070A">
  <meta name="description" content="Lucifer Launcher Android UI prototype — preview only">
  <title>Lucifer Launcher · UI Preview</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="landscape-overrides.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <section class="app-frame">
      <header class="topbar" id="topbar"></header>
      <main class="page-content" id="page-content" tabindex="-1"></main>
      <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>
    </section>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="mobile-drawer" id="mobile-drawer" aria-label="More sections" aria-hidden="true"></aside>
  <div class="modal-layer" id="modal-layer" hidden></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
