name: Lucifer Launcher — Performance APK Build

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Abyssal Tide UI + Performance Mode + Modern-GL Compat
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          sed -i 's/versionCode 10000000/versionCode 10000002/; s/versionCode 10000002/versionCode 10000003/; s/versionCode 10000003/versionCode 10000004/; s/versionCode 10000004/versionCode 10000005/; s/versionCode 10000005/versionCode 10000006/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Profile, Performance, Compat, Eras, Render Scale)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ALLVERSE.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ALLVERSE-v3.1.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ALLVERSE.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ALLVERSE.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ALLVERSE.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ALLVERSE.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-clearvision-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="allversion-fps-v3.1"
          TITLE="LUCIFER LAUNCHER v3.1 — All-Version FPS Engine"
          NOTES="### LUCIFER LAUNCHER v3.1 — All-Version FPS Engine

          - **Version-aware FPS engine:** the launcher now classifies the selected instance into a Minecraft render era and applies the exact settings that build understands, instead of one compromise profile for everything.
          - **The eras:** 1.0-1.2.5 (GL1) · 1.3-1.12.2 (LWJGL2) · 1.13-1.16.5 (LWJGL3) · 1.17-1.20.6 · 1.21-1.21.10 · 1.21.11+ (new pipeline). Fabric/Forge/Quilt ids and snapshots are parsed too.
          - **Correct option keys per era:** 1.12 and older get limitFramerate / fancyGraphics / ambientOcclusion / useVbo; 1.13+ gets maxFps / renderClouds / graphicsMode / ao; 1.17+ also gets simulationDistance=4 (the single cheapest 1.17+ win). Previously the modern keys were written to legacy instances and silently ignored.
          - **Per-era resolution budget:** 1.0-1.12.2 render up to native 1080p short side, 1.13-1.16.5 up to 960p, 1.17-1.20.6 900p, 1.21-1.21.10 850p, 1.21.11+ 800p — each newer era costs more per frame, so it gets a tighter budget and a 45% quality floor.
          - **Per-era chunk distance:** 8 / 6 / 5 / 4 / 4 / 4 blocks-of-chunks, tuned to what each era's renderer can actually push.
          - **GC and hitch flags:** G1 with 20 ms pause target, ParallelRefProc, AlwaysPreTouch, PerfDisableSharedMem, DisableExplicitGC (removes the random 10 FPS seconds). A collector you chose yourself is never overridden, and the flags this build adds are tracked and removed exactly when you switch the profile off.
          - **Era-specific JVM properties:** legacy LWJGL2 gets no-software-GL + quiet Forge signatures; LWJGL3+ gets a capped direct-buffer cache.
          - **Snapshot/restore is now era-safe:** switching one instance between Minecraft versions merges the backup instead of losing the original values, and only values this profile wrote are ever restored.
          - **Direct Installable APK:** LUCIFER-LAUNCHER-ALLVERSE-v3.1.apk (versionCode 10000006, upgrades cleanly over v3.0)
          - **Still Included:** renderer picker at the top of Video & Graphics, GL3 auto-profile + black-screen fix for 1.21.11+, cutout-free fullscreen, sharp pixel-budgeted rendering, BG10 Abyss Teal theme
          - **Branch:** ${GITHUB_REF_NAME} · **Commit:** ${GITHUB_SHA}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-ALLVERSE-v3.1.apk \
              LUCIFER-LAUNCHER-ALLVERSE.apk \
              LUCIFER-LAUNCHER-ALLVERSE.sha256 \
              LUCIFER-LAUNCHER-ALLVERSE.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-ALLVERSE-v3.1.apk \
              LUCIFER-LAUNCHER-ALLVERSE.apk \
              LUCIFER-LAUNCHER-ALLVERSE.sha256 \
              LUCIFER-LAUNCHER-ALLVERSE.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
