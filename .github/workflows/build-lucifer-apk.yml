name: Lucifer Launcher — Performance APK Build

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Abyssal Tide UI + Performance Mode + Modern-GL Compat
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          sed -i 's/versionCode 10000000/versionCode 10000002/; s/versionCode 10000002/versionCode 10000003/; s/versionCode 10000003/versionCode 10000004/; s/versionCode 10000004/versionCode 10000005/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Profile, Performance, Compat, Render Scale)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-RENDERERHUB.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-RENDERERHUB-v3.0.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-RENDERERHUB.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-RENDERERHUB.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-RENDERERHUB.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-RENDERERHUB.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-clearvision-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="renderer-hub-v3.0"
          TITLE="LUCIFER LAUNCHER v3.0 — Renderer Hub (One-tap Renderer Switching)"
          NOTES="### LUCIFER LAUNCHER v3.0 — Renderer Hub

          - **Renderer picker is now at the TOP of Video & Graphics:** open Settings → Video & Graphics and the first row is the renderer selector for the selected instance. It lists every renderer this device can actually run, with plain-language labels (Zink = OpenGL 4.6, MobileGlues = fast GL3, GL4ES = legacy GL2) and an "Engine default (auto)" option.
          - **No more hidden page:** before this build the only renderer selector lived inside the per-instance editor. Now it is one tap from the launcher: tapping the renderer chip in the top HUD opens Video & Graphics directly at that picker.
          - **It tells you which one you need:** for a 1.21.11+ instance the row warns in red when the current renderer cannot provide GL3 (that is what caused the black screen), and the summary confirms when the GL3 profile is active.
          - **Change applies immediately:** picking a renderer writes it straight into the selected instance profile, no separate save step, and survives restarts.
          - **Notch toggle fixed:** "Ignore notch" is now shown on every Android 9+ device (its default is ON, so it can also be switched back off) instead of being hidden when no cutout was detected.
          - **Direct Installable APK:** LUCIFER-LAUNCHER-RENDERERHUB-v3.0.apk (versionCode 10000005, upgrades cleanly over v2.9)
          - **Still Included:** sharp pixel-budgeted render scale, GL3 auto-profile for 1.21.11+, cutout-free fullscreen, Zink/Turnip tuning, BG10 Abyss Teal theme, crash-free profile startup
          - **Branch:** ${GITHUB_REF_NAME} · **Commit:** ${GITHUB_SHA}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-RENDERERHUB-v3.0.apk \
              LUCIFER-LAUNCHER-RENDERERHUB.apk \
              LUCIFER-LAUNCHER-RENDERERHUB.sha256 \
              LUCIFER-LAUNCHER-RENDERERHUB.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-RENDERERHUB-v3.0.apk \
              LUCIFER-LAUNCHER-RENDERERHUB.apk \
              LUCIFER-LAUNCHER-RENDERERHUB.sha256 \
              LUCIFER-LAUNCHER-RENDERERHUB.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
