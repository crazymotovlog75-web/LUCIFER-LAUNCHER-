name: Lucifer Launcher — Performance APK Build

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Abyssal Teal UI + 1.21+ FPS Pack + Modern-GL Compat
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          sed -i 's/versionCode 10000000/versionCode 10000002/; s/versionCode 10000002/versionCode 10000003/; s/versionCode 10000003/versionCode 10000004/; s/versionCode 10000004/versionCode 10000005/; s/versionCode 10000005/versionCode 10000006/; s/versionCode 10000006/versionCode 10000007/; s/versionCode 10000007/versionCode 10000008/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Profile, Compat, Eras, Render Scale)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK-v3.3.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-pack-v3.3-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="modernfps-v3.3"
          TITLE="LUCIFER LAUNCHER v3.3 — 1.21+ FPS Pack"
          NOTES="### LUCIFER LAUNCHER v3.3 — 1.21+ FPS Pack

          Tuned for exactly the versions you showed me: 1.21 and newer. 1.20.6 and below are untouched, and the v3.2 rollback stays in place: no resolution cap, no GC flags, no CPU pins, no clock mode, no driver variables, no renderer auto-switch.

          **1.21+ FPS (the low-FPS problem)**
          - **Zero-copy game surface.** On a 720p phone the engine quietly picked TextureView, which copies the whole frame through the GPU once more every single frame. 1.21+ instances now render straight into a SurfaceView, so that copy disappears.
          - **Moderate video profile, applied once and reversible.** Clouds, entity shadows, fancy leaves, smooth lighting, biome blend, view-bob nausea, portal distortion and heavy particles off; render distance 6, simulation distance 5, mipmaps 2, unlimited FPS. It only ever lowers a distance you already had - if you run 4 chunks you keep 4.
          - **MobileGlues wrapper per version.** For 1.21.11+ the generated wrapper config ignores per-call GL error checks and keeps a 512 MB shader cache, so the new pipeline stops recompiling shaders mid-frame (that was the visible stutter).
          - **Switch:** Settings > Video & Graphics > 1.21+ FPS Pack. Turning it off restores your original options.txt values exactly.

          **Black blocks on 1.21.11+ (the visual bug)**
          - The black/transparent wedge across the ground comes from the new pipeline drawing terrain through multi-draw indirect, which Mali drivers only accept through MobileGlues fully emulated path.
          - For 1.21.11+ the wrapper config now forces that emulated path (multidrawMode 4) plus the SurfaceView surface, which is the only surface path that draws the new pipeline without black geometry.
          - Your own renderer settings are not modified - the compatibility values are written into the generated MobileGlues config only.

          **What deliberately did NOT come back**
          - No resolution down-scaling, no forced GC flags, no big-core affinity, no sustained-clocks mode, no raised heap, no Mesa/Zink/Turnip environment overrides, no renderer switching. Those are the exact mechanisms that made v3.1 slower and they stay removed.

          **Direct Installable APK:** LUCIFER-LAUNCHER-PACK-v3.3.apk (versionCode 10000008, upgrades cleanly over v3.2)
          - **Theme unchanged:** BG10 Abyss Teal wallpaper, teal palette, Shadow-Dragon HUD, crystal-shard dock, renderer picker at the top of Video & Graphics.
          - **Branch:** ${GITHUB_REF_NAME} · **Commit:** ${GITHUB_SHA}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-PACK-v3.3.apk \
              LUCIFER-LAUNCHER-PACK.apk \
              LUCIFER-LAUNCHER-PACK.sha256 \
              LUCIFER-LAUNCHER-PACK.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-PACK-v3.3.apk \
              LUCIFER-LAUNCHER-PACK.apk \
              LUCIFER-LAUNCHER-PACK.sha256 \
              LUCIFER-LAUNCHER-PACK.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
