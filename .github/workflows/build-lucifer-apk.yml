name: Lucifer Launcher — Performance APK Build

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Abyssal Tide UI + Performance Mode + Modern-GL Compat
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          sed -i 's/versionCode 10000000/versionCode 10000002/; s/versionCode 10000002/versionCode 10000003/; s/versionCode 10000003/versionCode 10000004/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Profile, Performance, Compat, Render Scale)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-CLEARVISION.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-CLEARVISION-v2.9.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-CLEARVISION.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-CLEARVISION.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-CLEARVISION.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-CLEARVISION.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-clearvision-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="clearvision-v2.9"
          TITLE="LUCIFER LAUNCHER v2.9 — ClearVision (Sharp, Cutout-free, Black-Screen Fixed)"
          NOTES="### LUCIFER LAUNCHER v2.9 — ClearVision

          - **Blurry game fixed:** v2.8 capped the render surface at a flat 30% per axis (about 720x324 on a 1080p phone). v2.9 budgets by pixels instead: the surface now targets an **800 px short side** (~1778x800) and never drops below 45% of the screen, so the world and the text are sharp again.
          - **Black screen on Minecraft 1.21.11+ fixed:** those versions moved to the modern GPU pipeline, which needs a **GL 3.3+ core context**. The engine was still answering with a GLES2 context (and could fall back to the GL2-only GL4ES wrapper), so the world rendered black while the game kept running. v2.9 detects 1.21.11+ instances and applies the modern profile automatically: GLES3 context, a GL3-capable renderer (Zink first, then MobileGlues / Krypton / ANGLE, whichever the device supports) and the zero-copy SurfaceView path.
          - **If one renderer does not work on your driver:** long-press the FPS chip in the launcher HUD to walk to the next GL3 renderer, then press PLAY. The choice is saved to the instance.
          - **Left side cut fixed:** the game window was being inset away from the camera cutout in landscape (black strip on the left edge). The window now uses \`LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS\` and stops subtracting the notch from the display size, so the surface covers the whole screen.
          - **More performance:** mipmaps are back on (sharper *and* cheaper on modern drivers), the game surface is zero-copy, and the Mesa/Turnip stack now runs with \`ZINK_DESCRIPTORS=lazy\`, \`mesa_glthread=true\`, \`MESA_NO_ERROR=1\`, a 512 MB shader cache and immediate WSI presentation. The display frame-rate hint no longer drops the panel into a lower refresh mode.
          - **Direct Installable APK:** LUCIFER-LAUNCHER-CLEARVISION-v2.9.apk (versionCode 10000004, upgrades cleanly over v2.8)
          - **Still Included:** BG10 Abyss Teal theme, crash-free profile startup, Shadow-Dragon HUD, crystal-shard dock, LUCIFERMC server card, one-tap Performance Mode
          - **Branch:** ${GITHUB_REF_NAME} · **Commit:** ${GITHUB_SHA}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-CLEARVISION-v2.9.apk \
              LUCIFER-LAUNCHER-CLEARVISION.apk \
              LUCIFER-LAUNCHER-CLEARVISION.sha256 \
              LUCIFER-LAUNCHER-CLEARVISION.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-CLEARVISION-v2.9.apk \
              LUCIFER-LAUNCHER-CLEARVISION.apk \
              LUCIFER-LAUNCHER-CLEARVISION.sha256 \
              LUCIFER-LAUNCHER-CLEARVISION.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
