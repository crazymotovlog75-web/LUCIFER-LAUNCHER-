name: Lucifer Launcher — v3.4 (black-block fix + HOLY GL4ES + real FPS)

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Abyssal Teal UI + 1.21+ FPS Pack + Modern-GL Compat
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          # LWJGL shim: FrameStats + the glfwSwapBuffers hook that feeds the real FPS overlay.
          cp -rv overhaul/launcher-ui-overhaul/jre_lwjgl3glfw/* engine/jre_lwjgl3glfw/
          sed -i 's/versionCode 10000000/versionCode 10000002/; s/versionCode 10000002/versionCode 10000003/; s/versionCode 10000003/versionCode 10000004/; s/versionCode 10000004/versionCode 10000005/; s/versionCode 10000005/versionCode 10000006/; s/versionCode 10000006/versionCode 10000007/; s/versionCode 10000007/versionCode 10000008/; s/versionCode 10000008/versionCode 10000009/; s/versionCode 10000009/versionCode 10000010/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Profile, Compat, Eras, Render Scale)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK-v3.4.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Verify the FPS hook and the EGL config actually shipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          REPORT="### build verification report"
          add() { REPORT="${REPORT}"$'\n'"$1"; }

          if [ ! -f "$APK" ]; then
            add "APK missing at $APK"; echo "$REPORT"; exit 0
          fi
          add "apk size: $(stat -c%s "$APK") bytes"
          add "apk entries named classes: $(unzip -l "$APK" | grep -c 'classes.*\.dex' || true)"

          for j in $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -name '*.jar' | sort); do
            add "jar: ${j#engine/}"
            add "  has FrameStats.class: $(unzip -l "$j" | grep -c 'org/lwjgl/glfw/FrameStats.class' || true)"
            add "  GLFW.class mentions FrameStats: $(unzip -p "$j" org/lwjgl/glfw/GLFW.class 2>/dev/null | grep -ac 'FrameStats' || true)"
            add "  has GLFW.class: $(unzip -l "$j" | grep -c 'org/lwjgl/glfw/GLFW.class' || true)"
          done
          add "jar count: $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -name '*.jar' | wc -l)"
          add "assets/components/lwjgl3 tree: $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -maxdepth 2 | head -12 | tr '\n' ' ')"

          add "dex mentions holy_gl4es: $(unzip -p "$APK" classes.dex 2>/dev/null | grep -ac 'holy_gl4es' || true)"
          add "dex mentions FrameStats: $(unzip -p "$APK" classes.dex 2>/dev/null | grep -ac 'FrameStats' || true)"
          add "so entries: $(unzip -l "$APK" | grep -o 'lib/[a-z0-9_-]*/libpojavexec.so' | tr '\n' ' ')"
          add "so mentions the new EGL config: $(unzip -p "$APK" lib/arm64-v8a/libpojavexec.so 2>/dev/null | grep -ac 'No stencil' || true)"
          add "so mentions retrying with the legacy config: $(unzip -p "$APK" lib/arm64-v8a/libpojavexec.so 2>/dev/null | grep -ac 'legacy config' || true)"

          echo "$REPORT"
          printf '%s\n' "$REPORT" > "$RUNNER_TEMP/verify.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$RUNNER_TEMP/verify.md" > /dev/null || echo "could not post the report"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-pack-v3.3-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="modernfps-v3.4"
          TITLE="LUCIFER LAUNCHER v3.4 - black-block fix, HOLY GL4ES, real FPS"
          NOTES="### LUCIFER LAUNCHER v3.4 - black-block fix, HOLY GL4ES, real FPS

          **1. Black / translucent blocks and wedges in the world**
          - The game window was being created without a stencil buffer. Minecraft opens its window with stencil bits and the 1.21.11 render pipeline genuinely uses them; when the config handed back has none, those passes read whatever was left in the buffer, which is how opaque geometry came out as black or see-through slabs.
          - The EGL window config now requests STENCIL 8 (plus depth 24, MSAA off) and only accepts configs that can really back the context version the renderer runs.
          - This is a correctness fix in the window setup, not a shader hack, and it applies to every renderer.

          **2. Renderers that refused to launch on 1.21.11**
          - The config selection asked for ES2-only configs even while the renderer was creating an ES3 context, so context creation could fail outright on drivers that keep the two config sets apart. The ES3 renderable bit is now requested whenever the renderer runs GLES3.
          - The 1.21.11 ladder now leads with MobileGlues - the only wrapper that maps GL 3.3-4.6 straight onto the phone driver at playable speed - with Zink as the correctness fallback, then Krypton and ANGLE. The in-game HUD button still cycles down the ladder if a driver dislikes one entry.

          **3. HOLY GL4ES (new, selectable)**
          - Real new renderer id: pick it in Settings > Video and Graphics > Renderer, or per instance in the profile editor.
          - It is GL4ES driven through the fast path instead of the compatibility path: ES3 backend with real VAOs, vertex attributes kept in one VBO instead of being re-specified per draw, no one-log-line-per-stub-call (that logging alone is a file write per call, thousands per frame in Minecraft), fast maths, no NPOT downsample passes.
          - Honest scope: GL4ES emulates GL 2.1, so HOLY GL4ES is for 1.20.6 and older. It is never auto-selected for 1.21.11 and it cannot fix the new pipeline - no GL4ES build can. Where GL4ES is the right renderer, these settings remove its biggest per-frame costs, and the new badge will show you the real number on your device.

          **4. Real FPS display (always on, movable)**
          - Frames are counted inside the game at glfwSwapBuffers, so every counted frame is a frame that was actually presented. No estimate, no smoothing, no target number.
          - The badge shows fps, average frame time and the live renderer + instance. It is on by default, sits on top of the game, and you can drag it anywhere - the position is saved.
          - If the game stops presenting frames the badge says stalled instead of showing a stale number. Switch: Settings > Video and Graphics > FPS overlay.

          **Still respected from before:** no resolution cap, no forced GC, no CPU pins, no clock mode, no driver env overrides, no renderer auto-switch during play.

          **Direct Installable APK:** LUCIFER-LAUNCHER-PACK-v3.4.apk (versionCode 10000010, upgrades cleanly over v3.3)
          - **Branch:** ${GITHUB_REF_NAME} · **Commit:** ${GITHUB_SHA}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-PACK-v3.4.apk \
              LUCIFER-LAUNCHER-PACK.apk \
              LUCIFER-LAUNCHER-PACK.sha256 \
              LUCIFER-LAUNCHER-PACK.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-PACK-v3.4.apk \
              LUCIFER-LAUNCHER-PACK.apk \
              LUCIFER-LAUNCHER-PACK.sha256 \
              LUCIFER-LAUNCHER-PACK.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
