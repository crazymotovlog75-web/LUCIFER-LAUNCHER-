name: Lucifer Launcher — Shadow Dragon APK Build

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Shadow Monarch (#02) + Ender Dragon (#05) UI Overhaul & Startup Crash Fix
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          sed -i 's/versionCode 10000000/versionCode 10000001/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Including Fresh-Install Profile Selection Fix)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-SHADOW-DRAGON.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-SHADOW-DRAGON-v2.6-FIXED.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-SHADOW-DRAGON.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-SHADOW-DRAGON.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-SHADOW-DRAGON.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-SHADOW-DRAGON.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-shadow-dragon-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="shadow-dragon-v2.6"
          TITLE="LUCIFER LAUNCHER v2.6 — Shadow Dragon Cataclysm Edition (Startup Crash Fixed)"
          NOTES="### LUCIFER LAUNCHER v2.6 — Shadow Monarch (#02) × Ender Dragon Cataclysm (#05) (Fixed Build)

          - **Startup Crash Fixed:** Resolved fresh-install \`RuntimeException: The current profile stopped existing :(\` in \`LauncherProfiles.getCurrentProfile()\` / \`AsyncAssetManager.unpackSingleFiles()\`, synchronized concurrent profile initialization, and added automatic default-profile self-healing.
          - **Direct Installable Android APK:** \`LUCIFER-LAUNCHER-SHADOW-DRAGON-v2.6-FIXED.apk\` (versionCode \`10000001\`, installs cleanly or upgrades over v2.5)
          - **Top 3-Module Tactical HUD:** Horned Shadow-Dragon Lucifer Crest + Live Vulkan / FPS / RAM Telemetry + Player Account Switcher
          - **Bottom Floating Crystal-Shard Dock:** Home · Profiles · Mods · Servers · Controls · Skins · Settings
          - **Home Sanctum:** \`LUCIFERMC — LIFESTEEL SMP\` (\`play.lucifermc.fun\`) Combat Card + Active Build Quick-Switch Strip + 3D Shadow-Flame Avatar Stage + Dragon-Plasma \`PLAY\` Reactor
          - **Branch:** \`${GITHUB_REF_NAME}\` · **Commit:** \`${GITHUB_SHA}\`"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-SHADOW-DRAGON-v2.6-FIXED.apk \
              LUCIFER-LAUNCHER-SHADOW-DRAGON.apk \
              LUCIFER-LAUNCHER-SHADOW-DRAGON.sha256 \
              LUCIFER-LAUNCHER-SHADOW-DRAGON.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-SHADOW-DRAGON-v2.6-FIXED.apk \
              LUCIFER-LAUNCHER-SHADOW-DRAGON.apk \
              LUCIFER-LAUNCHER-SHADOW-DRAGON.sha256 \
              LUCIFER-LAUNCHER-SHADOW-DRAGON.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi

          # Also overwrite shadow-dragon-v2.5 asset so any older link serves the fixed APK too
          if gh release view "shadow-dragon-v2.5" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "shadow-dragon-v2.5" \
              LUCIFER-LAUNCHER-SHADOW-DRAGON.apk \
              LUCIFER-LAUNCHER-SHADOW-DRAGON.sha256 \
              LUCIFER-LAUNCHER-SHADOW-DRAGON.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          fi
