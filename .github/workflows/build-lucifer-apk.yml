name: Lucifer Launcher — Shadow Dragon APK Build

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Abyssal Tide Wallpaper + Teal Palette + Startup Crash Fix
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          sed -i 's/versionCode 10000000/versionCode 10000002/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Including Fresh-Install Profile Selection Fix)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ABYSSAL-TIDE.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ABYSSAL-TIDE-v2.7.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ABYSSAL-TIDE.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ABYSSAL-TIDE.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ABYSSAL-TIDE.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-ABYSSAL-TIDE.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-shadow-dragon-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="abyssal-tide-v2.7"
          TITLE="LUCIFER LAUNCHER v2.7 — Abyssal Tide (New Background + Teal Theme)"
          NOTES="### LUCIFER LAUNCHER v2.7 — Abyssal Tide

          - **New Launcher Background:** Deep-sea light-ray wallpaper (BG10 \`Abyss Teal\`) is now the bundled default behind the whole launcher.
          - **Matching Teal Palette:** Accent shifted to luminous aqua \`#2FE9FF\`, surfaces/glass/backdrop retuned to deep teal-black so text and cards stay crisp on the new art. Magenta remains as the contrast highlight.
          - **Direct Installable APK:** \`LUCIFER-LAUNCHER-ABYSSAL-TIDE-v2.7.apk\` (versionCode \`10000002\`, upgrades cleanly over v2.6)
          - **Still Included:** Startup crash fix (self-healing profile selection), 3-module Shadow-Dragon HUD, crystal-shard dock, LUCIFERMC server card
          - **Branch:** \`${GITHUB_REF_NAME}\` · **Commit:** \`${GITHUB_SHA}\`"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-ABYSSAL-TIDE-v2.7.apk \
              LUCIFER-LAUNCHER-ABYSSAL-TIDE.apk \
              LUCIFER-LAUNCHER-ABYSSAL-TIDE.sha256 \
              LUCIFER-LAUNCHER-ABYSSAL-TIDE.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-ABYSSAL-TIDE-v2.7.apk \
              LUCIFER-LAUNCHER-ABYSSAL-TIDE.apk \
              LUCIFER-LAUNCHER-ABYSSAL-TIDE.sha256 \
              LUCIFER-LAUNCHER-ABYSSAL-TIDE.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
