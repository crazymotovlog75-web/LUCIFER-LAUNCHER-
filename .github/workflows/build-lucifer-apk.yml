name: Lucifer Launcher — v3.4 (black-block fix + HOLY GL4ES + real FPS)

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Abyssal Teal UI + 1.21+ FPS Pack + Modern-GL Compat
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          # LWJGL shim: FrameStats + the glfwSwapBuffers hook that feeds the real FPS overlay.
          cp -rv overhaul/launcher-ui-overhaul/jre_lwjgl3glfw/* engine/jre_lwjgl3glfw/
          sed -i 's/versionCode 10000000/versionCode 10000002/; s/versionCode 10000002/versionCode 10000003/; s/versionCode 10000003/versionCode 10000004/; s/versionCode 10000004/versionCode 10000005/; s/versionCode 10000005/versionCode 10000006/; s/versionCode 10000006/versionCode 10000007/; s/versionCode 10000007/versionCode 10000008/; s/versionCode 10000008/versionCode 10000009/; s/versionCode 10000009/versionCode 10000010/; s/versionCode 10000010/versionCode 10000011/; s/versionCode 10000011/versionCode 10000012/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Profile, Compat, Eras, Render Scale)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK-v3.5.1.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Verify the FPS hook and the EGL config actually shipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          REPORT="### build verification report"
          add() { REPORT="${REPORT}"$'\n'"$1"; }

          if [ ! -f "$APK" ]; then
            add "APK missing at $APK"; echo "$REPORT"; exit 0
          fi
          add "apk size: $(stat -c%s "$APK") bytes"
          add "apk entries named classes: $(unzip -l "$APK" | grep -c 'classes.*\.dex' || true)"

          for j in $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -name '*.jar' | sort); do
            add "jar: ${j#engine/}"
            add "  has FrameStats.class: $(unzip -l "$j" | grep -c 'org/lwjgl/glfw/FrameStats.class' || true)"
            add "  GLFW.class mentions FrameStats: $(unzip -p "$j" org/lwjgl/glfw/GLFW.class 2>/dev/null | grep -ac 'FrameStats' || true)"
            add "  has GLFW.class: $(unzip -l "$j" | grep -c 'org/lwjgl/glfw/GLFW.class' || true)"
          done
          add "jar count: $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -name '*.jar' | wc -l)"
          add "assets/components/lwjgl3 tree: $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -maxdepth 2 | head -12 | tr '\n' ' ')"

          add "dex mentions holy_gl4es: $(unzip -p "$APK" classes.dex 2>/dev/null | grep -ac 'holy_gl4es' || true)"
          add "dex mentions FrameStats: $(unzip -p "$APK" classes.dex 2>/dev/null | grep -ac 'FrameStats' || true)"
          add "so entries: $(unzip -l "$APK" | grep -o 'lib/[a-z0-9_-]*/libpojavexec.so' | tr '\n' ' ')"
          add "so mentions the new EGL config: $(unzip -p "$APK" lib/arm64-v8a/libpojavexec.so 2>/dev/null | grep -ac 'No stencil' || true)"
          add "so mentions retrying with the legacy config: $(unzip -p "$APK" lib/arm64-v8a/libpojavexec.so 2>/dev/null | grep -ac 'legacy config' || true)"

          echo "$REPORT"
          printf '%s\n' "$REPORT" > "$RUNNER_TEMP/verify.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$RUNNER_TEMP/verify.md" > /dev/null || echo "could not post the report"

      - name: Assert FPS hook, HOLY GL4ES and the EGL fix are in the APK
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          shim_jars=0
          for j in $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -name '*merged-modules.jar' | sort); do
            shim_jars=$((shim_jars + 1))
            unzip -l "$j" | grep -q 'org/lwjgl/glfw/FrameStats.class' \
              || { echo "FAIL: FrameStats.class missing from ${j#engine/}"; exit 1; }
            unzip -p "$j" org/lwjgl/glfw/GLFW.class | grep -aq 'FrameStats' \
              || { echo "FAIL: glfwSwapBuffers is not hooked in ${j#engine/}"; exit 1; }
            echo "shim ok: ${j#engine/}"
          done
          test "$shim_jars" -ge 2 || { echo "FAIL: expected both LWJGL shim jars, found $shim_jars"; exit 1; }

          # HOLY GL4ES: the renderer id is in resources.arsc (picker list) and in the dex (library map)
          HOLY=$( (unzip -p "$APK" resources.arsc; \
                    for d in $(unzip -l "$APK" | awk '/classes.*[.]dex/{print $4}'); do unzip -p "$APK" "$d"; done) \
                  | grep -ac 'holy_gl4es' || true)
          test "${HOLY:-0}" -gt 0 || { echo "FAIL: holy_gl4es is not in the shipped APK"; exit 1; }
          echo "holy_gl4es occurrences: $HOLY"

          unzip -p "$APK" lib/arm64-v8a/libpojavexec.so | grep -aq 'No stencil' \
            || { echo "FAIL: the stencil/ES3 EGL config is not in libpojavexec.so"; exit 1; }
          echo "OK: FPS hook in both shim jars, HOLY GL4ES registered, EGL config compiled in"

      - name: Assert the Liquid Crystal glass revamp is in the APK
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          DEXES=$(unzip -l "$APK" | awk '/classes.*[.]dex/{print $4}')
          echo "dex entries: $(echo $DEXES | tr '\n' ' ')"

          # 1. the glass panes are real custom views, referenced from the layouts, so their
          #    class names survive R8 and show up in the dex string pool.
          for needle in GlassFrameLayout GlassLinearLayout; do
            HITS=$( for d in $DEXES; do unzip -p "$APK" "$d"; done | grep -ac "$needle" || true )
            test "${HITS:-0}" -gt 0 \
              || { echo "FAIL: $needle is missing from the shipped APK"; exit 1; }
            echo "glass view ok: $needle ($HITS hits)"
          done

          # 2. the styleable (lgRadius/lgTint/lgScrim/lgRefraction), the Liquid Crystal theme and
          #    the aurora wallpaper all have to be in the resource table.
          for needle in lgRadius lgTint lgScrim Wallpaper22 lucifer_wallpaper_22; do
            HITS=$( unzip -p "$APK" resources.arsc | grep -ac "$needle" || true )
            test "${HITS:-0}" -gt 0 \
              || { echo "FAIL: $needle is missing from resources.arsc (glass theme not packaged)"; exit 1; }
            echo "resource ok: $needle ($HITS hits)"
          done

          # 3. the glass scene drawable is wired as the window background of the theme.
          unzip -p "$APK" resources.arsc | grep -aq 'bg_liquid_scene' \
            || { echo "FAIL: bg_liquid_scene is not packaged"; exit 1; }
          echo "OK: glass panes, glass theme, aurora wallpaper and scene drawable shipped"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-pack-v3.5.1-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="liquid-v3.5.1"
          TITLE="LUCIFER LAUNCHER v3.5.1 - Liquid Crystal Clear glass UI (L03 side rail)"
          NOTES="### LUCIFER LAUNCHER v3.5.1 - Liquid Crystal Clear glass UI (L03 side rail)

          **The UI you picked, built for real**
          - The launcher now uses the **L03 side rail** layout from the ten glass mockups: a full-height glass rail on the left, one glass header pill, the content stage in the middle and one glass status strip along the bottom.
          - Nothing was faked with a flat translucent box. Every pane is a real liquid-glass surface: it refracts the aurora wallpaper that sits behind it, adds a white veil, a bottom scrim, a specular sweep and the three lens-rim hairlines. The same material stack the iOS glass look uses.
          - Glass panes are a single textured quad each (one captured, pre-blurred backdrop), so the material costs no per-frame blur and no extra full-screen pass.
          - Selected items glow cyan exactly like the mockup: HOME in the rail, the active instance row, the current profile card.

          **Home screen**
          - Left: the instance hero card with version / fabric / active, renderer, shaders, server, the skin preview and the READY TO LAUNCH pill.
          - Right: LUCIFERMC card (players, play.lucifermc.fun, LIVE 24ms, JOIN / DISCORD / WIKI), the instances shelf with the quick-switch cards, and the MOD STORE / HUD KEYS shortcuts.
          - Bottom: TOP MODS strip (Sodium, Iris, Lithium, Krypton, Ferrite) with 42 ACTIVE.

          **New wallpaper: Liquid Crystal Clear**
          - Aurora scene rendered for this revamp and bundled as wallpaper 22, shipping as the default. It is selectable in the wallpaper studio like every other scene.
          - A wallpaper of your own still works: the panes refract whatever is behind them.

          **Still respected from before:** no resolution cap, no forced GC, no CPU pins, no clock mode, no driver env overrides, no renderer auto-switch during play. Everything from v3.4 (stencil/ES3 EGL config, HOLY GL4ES, real movable FPS badge) is untouched.

          **Direct Installable APK:** LUCIFER-LAUNCHER-PACK-v3.5.1.apk (versionCode 10000012, upgrades cleanly over v3.5)
          - **Branch:** ${GITHUB_REF_NAME} · **Commit:** ${GITHUB_SHA}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-PACK-v3.5.1.apk \
              LUCIFER-LAUNCHER-PACK.apk \
              LUCIFER-LAUNCHER-PACK.sha256 \
              LUCIFER-LAUNCHER-PACK.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-PACK-v3.5.1.apk \
              LUCIFER-LAUNCHER-PACK.apk \
              LUCIFER-LAUNCHER-PACK.sha256 \
              LUCIFER-LAUNCHER-PACK.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
