name: Lucifer Launcher — Performance APK Build

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Abyssal Tide UI + Performance Rollback + Modern-GL Compat
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          sed -i 's/versionCode 10000000/versionCode 10000002/; s/versionCode 10000002/versionCode 10000003/; s/versionCode 10000003/versionCode 10000004/; s/versionCode 10000004/versionCode 10000005/; s/versionCode 10000005/versionCode 10000006/; s/versionCode 10000006/versionCode 10000007/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Profile, Compat, Eras, Render Scale)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-STOCK.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-STOCK-v3.2.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-STOCK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-STOCK.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-STOCK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-STOCK.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-clearvision-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="rollback-stock-v3.2"
          TITLE="LUCIFER LAUNCHER v3.2 — Rollback (Engine Defaults Restored)"
          NOTES="### LUCIFER LAUNCHER v3.2 — Rollback: engine defaults restored

          - **The forced performance profile is gone.** It is what made the game run worse than the stock launcher on your device, so v3.2 removes it instead of tuning it further. There is no Performance Mode toggle in the HUD any more.
          - **What was switched off:** automatic render-resolution down-scaling, the automatic video-options preset (render distance / simulation distance / graphics / effects), the injected JVM GC flags, the forced big-core CPU affinity, the forced sustained-clock mode, the raised heap allocation, the Zink/Mesa/Turnip driver variables and the renderer auto-switch at launcher start.
          - **Your own settings come back:** on first launch after installing v3.2 the launcher restores the option snapshot it saved before it ever touched your instance, so options.txt returns to the values you had (and the keys it added are removed).
          - **v3.2 ships the stock engine behaviour:** resolution = whatever the resolution slider says (default native/auto, no cap), video options = yours, JVM args = yours (the flags this launcher added are stripped, a collector you picked yourself is kept), Linux/Android defaults untouched.
          - **Still fixed, because these were bugs, not performance tweaks:** Minecraft 1.21.11+ black screen (GL3 context + SurfaceView), the blurry down-scaled image (the cap is gone, so it renders at full resolution again), the camera-cutout black strip on the left edge, and the renderer picker that now sits at the top of Video & Graphics.
          - **Direct Installable APK:** LUCIFER-LAUNCHER-STOCK-v3.2.apk (versionCode 10000007, upgrades cleanly over v3.1)
          - **Theme unchanged:** BG10 Abyss Teal wallpaper, teal palette, Shadow-Dragon HUD, crystal-shard dock, LUCIFERMC server card.
          - **Branch:** ${GITHUB_REF_NAME} · **Commit:** ${GITHUB_SHA}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-STOCK-v3.2.apk \
              LUCIFER-LAUNCHER-STOCK.apk \
              LUCIFER-LAUNCHER-STOCK.sha256 \
              LUCIFER-LAUNCHER-STOCK.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-STOCK-v3.2.apk \
              LUCIFER-LAUNCHER-STOCK.apk \
              LUCIFER-LAUNCHER-STOCK.sha256 \
              LUCIFER-LAUNCHER-STOCK.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
