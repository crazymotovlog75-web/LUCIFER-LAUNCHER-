name: Lucifer Launcher — v3.6.0 (native angular showcase + splash)

on:
  push:
    branches:
      - 'arena/fcd2b0b8-lucifer-launcher'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Shadow-Dragon UI Overhaul
        uses: actions/checkout@v4
        with:
          path: overhaul

      - name: Clone Lucifer Launcher Android Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch arena/581836b4-lucifer-launcher-v2 --depth 1 \
            https://github.com/crazymotovlog75-web/LUCIFER-LAUNCHER-v2.git engine

      - name: Apply Lucifer Native Showcase + Existing FPS Pack + Modern-GL Compat
        run: |
          cp -rv overhaul/launcher-ui-overhaul/app_pojavlauncher/* engine/app_pojavlauncher/
          # LWJGL shim: FrameStats + the glfwSwapBuffers hook that feeds the real FPS overlay.
          cp -rv overhaul/launcher-ui-overhaul/jre_lwjgl3glfw/* engine/jre_lwjgl3glfw/
          sed -i 's/versionCode 10000000/versionCode 10000013/; s/versionName getVersionName()/versionName "3.6.0"/' engine/app_pojavlauncher/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Run JVM Unit Tests (Profile, Compat, Eras, Render Scale)
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:testDebugUnitTest --no-daemon --stacktrace

      - name: Update Language List & Build Installable Release APK
        working-directory: engine
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"

          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/release-build.log"

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK-v3.6.0.apk"
          sha256sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.sha256"
          md5sum "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk" > "$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.md5"

          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Verify the FPS hook and the EGL config actually shipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          REPORT="### build verification report"
          add() { REPORT="${REPORT}"$'\n'"$1"; }

          if [ ! -f "$APK" ]; then
            add "APK missing at $APK"; echo "$REPORT"; exit 0
          fi
          add "apk size: $(stat -c%s "$APK") bytes"
          add "apk entries named classes: $(unzip -l "$APK" | grep -c 'classes.*\.dex' || true)"

          for j in $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -name '*.jar' | sort); do
            add "jar: ${j#engine/}"
            add "  has FrameStats.class: $(unzip -l "$j" | grep -c 'org/lwjgl/glfw/FrameStats.class' || true)"
            add "  GLFW.class mentions FrameStats: $(unzip -p "$j" org/lwjgl/glfw/GLFW.class 2>/dev/null | grep -ac 'FrameStats' || true)"
            add "  has GLFW.class: $(unzip -l "$j" | grep -c 'org/lwjgl/glfw/GLFW.class' || true)"
          done
          add "jar count: $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -name '*.jar' | wc -l)"
          add "assets/components/lwjgl3 tree: $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -maxdepth 2 | head -12 | tr '\n' ' ')"

          add "dex mentions holy_gl4es: $(unzip -p "$APK" classes.dex 2>/dev/null | grep -ac 'holy_gl4es' || true)"
          add "dex mentions FrameStats: $(unzip -p "$APK" classes.dex 2>/dev/null | grep -ac 'FrameStats' || true)"
          add "so entries: $(unzip -l "$APK" | grep -o 'lib/[a-z0-9_-]*/libpojavexec.so' | tr '\n' ' ')"
          add "so mentions the new EGL config: $(unzip -p "$APK" lib/arm64-v8a/libpojavexec.so 2>/dev/null | grep -ac 'No stencil' || true)"
          add "so mentions retrying with the legacy config: $(unzip -p "$APK" lib/arm64-v8a/libpojavexec.so 2>/dev/null | grep -ac 'legacy config' || true)"

          echo "$REPORT"
          printf '%s\n' "$REPORT" > "$RUNNER_TEMP/verify.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$RUNNER_TEMP/verify.md" > /dev/null || echo "could not post the report"

      - name: Assert FPS hook, HOLY GL4ES and the EGL fix are in the APK
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          shim_jars=0
          for j in $(find engine/app_pojavlauncher/src/main/assets/components/lwjgl3 -name '*merged-modules.jar' | sort); do
            shim_jars=$((shim_jars + 1))
            unzip -l "$j" | grep -q 'org/lwjgl/glfw/FrameStats.class' \
              || { echo "FAIL: FrameStats.class missing from ${j#engine/}"; exit 1; }
            unzip -p "$j" org/lwjgl/glfw/GLFW.class | grep -aq 'FrameStats' \
              || { echo "FAIL: glfwSwapBuffers is not hooked in ${j#engine/}"; exit 1; }
            echo "shim ok: ${j#engine/}"
          done
          test "$shim_jars" -ge 2 || { echo "FAIL: expected both LWJGL shim jars, found $shim_jars"; exit 1; }

          # HOLY GL4ES: the renderer id is in resources.arsc (picker list) and in the dex (library map)
          HOLY=$( (unzip -p "$APK" resources.arsc; \
                    for d in $(unzip -l "$APK" | awk '/classes.*[.]dex/{print $4}'); do unzip -p "$APK" "$d"; done) \
                  | grep -ac 'holy_gl4es' || true)
          test "${HOLY:-0}" -gt 0 || { echo "FAIL: holy_gl4es is not in the shipped APK"; exit 1; }
          echo "holy_gl4es occurrences: $HOLY"

          unzip -p "$APK" lib/arm64-v8a/libpojavexec.so | grep -aq 'No stencil' \
            || { echo "FAIL: the stencil/ES3 EGL config is not in libpojavexec.so"; exit 1; }
          echo "OK: FPS hook in both shim jars, HOLY GL4ES registered, EGL config compiled in"

      - name: Assert the native Lucifer showcase and splash are in the APK
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/dist-apk/LUCIFER-LAUNCHER-PACK.apk"
          DEXES=$(unzip -l "$APK" | awk '/classes.*[.]dex/{print $4}')
          echo "dex entries: $(echo $DEXES | tr '\n' ' ')"

          # Source-level integration checks: the launcher entrypoint and both responsive
          # activity layouts must wire in the real splash before the UI build is accepted.
          grep -q 'lucifer_splash_screen' engine/app_pojavlauncher/src/main/res/layout-land/activity_pojav_launcher.xml
          grep -q 'lucifer_splash_screen' engine/app_pojavlauncher/src/main/res/layout/activity_pojav_launcher.xml
          grep -q 'android:screenOrientation="fullSensor"' engine/app_pojavlauncher/src/main/AndroidManifest.xml
          grep -q 'ObjectAnimator.ofInt' engine/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/LauncherActivity.java
          echo "source integration ok: landscape/portrait layouts, full-sensor rotation and animated Activity"

          # Verify the compiled resource table contains the splash, angular panels and default scene.
          for needle in lucifer_splash_screen bg_lucifer_slanted_panel bg_lucifer_slanted_cta lucifer_wallpaper_overworld Wallpaper22; do
            HITS=$( unzip -p "$APK" resources.arsc | grep -ac "$needle" || true )
            test "${HITS:-0}" -gt 0 \
              || { echo "FAIL: $needle is missing from the packaged native UI"; exit 1; }
            echo "native resource ok: $needle ($HITS hits)"
          done

          echo "OK: native Lucifer UI, splash and scene wallpaper shipped; engine checks ran above"

      - name: Surface Build Diagnostics on Failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then
            echo "## Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|error:|AAPT:|Exception" "$RUNNER_TEMP/release-build.log" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 40 "$RUNNER_TEMP/release-build.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucifer-launcher-pack-v3.6.0-apk
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist-apk
        run: |
          TAG="lucifer-v3.6.0"
          TITLE="LUCIFER LAUNCHER v3.6.0 - Native Angular Cyan Showcase"
          NOTES="### LUCIFER LAUNCHER v3.6.0 - Native Android Showcase UI

          **The supplied Lucifer look is integrated into the Android launcher APK.**
          - Full-screen, landscape-first Lucifer layout with a responsive portrait fallback and angular navy/cyan surfaces.
          - A branded animated splash appears on each launcher Activity open, then fades into the native Home screen.
          - Existing native destinations remain connected: profiles/instances, mod search and management, server hub, custom controls, skins, wallpaper studio and settings.
          - The new dark overworld scene is bundled as wallpaper 22 and remains selectable in the native wallpaper studio.
          - Home shows the selected profile and real local profile settings; it does not invent player counts, pings, renderer data or installed-mod counts. Live server status is queried in the native Server Hub.

          **Existing game-engine features are retained.** This UI update does not claim extra GPU/runtime/server capabilities. Microsoft authentication continues to use the launcher's existing sign-in flow.

          **Direct Installable APK:** LUCIFER-LAUNCHER-PACK-v3.6.0.apk (versionCode 10000013)
          - **Branch:** ${GITHUB_REF_NAME} · **Commit:** ${GITHUB_SHA}"


          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUCIFER-LAUNCHER-PACK-v3.6.0.apk \
              LUCIFER-LAUNCHER-PACK.apk \
              LUCIFER-LAUNCHER-PACK.sha256 \
              LUCIFER-LAUNCHER-PACK.md5 \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$TAG" \
              LUCIFER-LAUNCHER-PACK-v3.6.0.apk \
              LUCIFER-LAUNCHER-PACK.apk \
              LUCIFER-LAUNCHER-PACK.sha256 \
              LUCIFER-LAUNCHER-PACK.md5 \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
